name: contextnorf

services:
  backend:
    build: ./backend
    container_name: contextnorf-backend
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: contextnorf-frontend
    depends_on:
      - backend
    ports:
      - "8585:80"
    restart: unless-stopped
